# What "good" looks like for each gold table, rollups and steps alike. If an
# `error` check fails, the table keeps its last good contents; `warn` checks
# are only reported. The dashboards show every gate's last result.
version: "1.0.0"

rules:
  - table: gold.wiki_hourly
    checks:
      - {type: row_count, min: 1}
      - {type: unique, columns: [event_ts, wiki]}  # one row per wiki and hour
      - {type: not_null, columns: [wiki, edit_count]}
      - type: expression
        description: a wiki's bots, anonymous editors and reverts can't outnumber its edits
        sql: "bot_edits <= edit_count AND anonymous_edits <= edit_count AND revert_edits <= edit_count"
      - {type: freshness, max_lag_hours: 2}  # the feed or the flush stopped

  - table: gold.article_hourly
    checks:
      - {type: row_count, min: 1}
      - {type: unique, columns: [event_ts, wiki, title]}
      - {type: range, column: edit_count, min: 1}
      - {type: freshness, max_lag_hours: 2}

  - table: gold.trend_baselines
    checks:
      - {type: row_count, min: 1}
      - {type: unique, columns: [wiki, hour_of_day]}
      - {type: range, column: hour_of_day, min: 0, max: 23}
      - {type: range, column: mean_edits, min: 1}  # an article edited in an hour has at least one edit in it

  - table: gold.top_articles_daily
    checks:
      - {type: unique, columns: [day, rank]}
      - {type: range, column: rank, min: 1, max: 50}
      - {type: freshness, max_lag_hours: 26}  # day is the day's start

  - table: gold.classifier_daily
    checks:
      - {type: row_count, min: 1}
      - {type: unique, columns: [event_ts]}  # one row per day
      - type: expression
        description: the confusion matrix covers exactly the evaluated bursts
        sql: "true_positives + false_positives + false_negatives + true_negatives = evaluated_bursts"
      - type: expression
        description: a burst is evaluated only if scored and labeled, and labeled only if flagged
        sql: "evaluated_bursts <= scored_bursts AND evaluated_bursts <= labeled_bursts AND labeled_bursts <= flagged_bursts"
      - {type: freshness, max_lag_hours: 26}  # event_ts is the day's start

  - table: gold.wiki_daily_content
    checks:
      - {type: row_count, min: 1}
      - {type: unique, columns: [event_ts, wiki]}  # one row per wiki and day
      - {type: not_null, columns: [wiki, all_edits]}
      - type: expression
        description: a wiki's minor, unsummarized and large-removing edits can't outnumber its edits
        sql: "minor_edits <= all_edits AND unsummarized_edits <= all_edits AND large_removals <= all_edits"
      - {type: range, column: bytes_added, min: 0}
      - {type: range, column: bytes_removed, min: 0}
      - {type: freshness, max_lag_hours: 26}  # event_ts is the day's start

  - table: gold.wiki_sizes
    checks:
      - {type: row_count, min: 1}
      - {type: unique, columns: [wiki]}  # a lookup's keys are unique
      - {type: not_null, columns: [wiki, size_tier]}

  - table: gold.news_classifier
    checks:
      - {type: not_null, columns: [feature, weight, center, scale]}
      - type: expression
        description: the classifier beats always guessing the more common label
        sql: "training_accuracy > greatest(news_share, 1 - news_share)"
      - type: range  # huge weights mean the fit ran away; the detector keeps the last good model
        column: weight
        min: -15
        max: 15
