# What the data means: the dimensions to slice by and the metrics to ask for.
# Views, dashboards and AI agents (through MCP) all read these definitions.
version: "1.0.0"

models:
  - name: edits
    description: >
      Edits to Wikipedia articles in every language, live: one row per edit,
      bots included. Use it for how much editing is happening, where, and by whom.
    source: edits
    time_dimension: event_ts
    dimensions:
      - {name: event_ts, type: timestamp, label: Time}
      - name: wiki
        type: string
        label: Wiki
        description: The Wikipedia, by database name, e.g. enwiki (English) or dewiki (German).
      - name: language
        type: string
        label: Language
        description: The Wikipedia's language code, e.g. en, de, ja.
      - {name: title, type: string, label: Title}
      - {name: url, type: string, label: Article, description: The article's address.}
      - name: kind
        type: string
        label: Kind
        description: edit, or new for an article's first edit.
      - name: editor_type
        type: string
        label: Editor
        description: Who made the edit, broadly; bot, anonymous (an IP address or temporary account) or registered.
        sql: "{{ editor_type() }}"  # config/macros/default.sql
      - name: site
        type: string
        label: Site
        description: The site the article is on, e.g. en.wikipedia.org.
        sql: "{{ url_host('url') }}"  # Trino has its own version, in config/macros/trino.sql
      - name: temporary_account
        type: boolean
        label: Temporary account
        description: "Whether the edit was made from a Wikimedia temporary account: an automatically created account, named ~..., for editors who aren't logged in. These are a subset of anonymous editors; the rest edit from an IP address. Producers started sending the is_temporary flag around October 2026. For earlier rows the value is inferred from the editor name starting with '~'."
        sql: "{{ temporary_account_edit() }}"
    metrics:
      - name: edit_count
        description: Number of edits.
        agg: count
        label: Edits
      - name: editors
        description: Number of different editors (accounts, IP addresses and temporary accounts).
        agg: count_distinct
        sql: editor
        label: Editors
      - name: articles
        description: Number of different articles edited.
        agg: count_distinct
        sql: url
        label: Articles
      - name: new_articles
        description: Number of articles created.
        agg: count
        filters: ["kind = 'new'"]
        label: New articles
      - name: bot_edits
        description: Edits by bots.
        agg: count
        filters: ["is_bot = true"]
        label: Bot edits
      - name: human_edits
        description: Edits by people with an account; not bots, not anonymous.
        agg: count
        filters: ["{{ human_edit() }}"]
        label: Human edits
      - name: anonymous_edits
        description: Edits by editors without an account (an IP address or a temporary account).
        agg: count
        filters: ["is_anonymous = true"]
        label: Anonymous edits
      - name: revert_edits
        description: Edits whose summary says they undo another edit, in English conventions (so a lower bound outside English).
        agg: count
        filters: ["is_revert = true"]
        label: Reverts
      - name: net_bytes
        description: Net change in the articles' size, in bytes; text added minus text removed.
        agg: sum
        sql: bytes_delta
        label: Net bytes added
        format: integer
      - name: bot_share
        description: Share of edits made by bots.
        type: ratio
        numerator: bot_edits
        denominator: edit_count
        label: Bot share
        format: percent
      - name: human_share
        description: Share of edits made by people with an account.
        type: ratio
        numerator: human_edits
        denominator: edit_count
        label: Human share
        format: percent
      - name: anonymous_share
        description: Share of edits made without an account.
        type: ratio
        numerator: anonymous_edits
        denominator: edit_count
        label: Anonymous share
        format: percent
      - name: revert_share
        description: Share of edits that undo another edit. High means disputes or vandalism being cleaned up.
        type: ratio
        numerator: revert_edits
        denominator: edit_count
        label: Revert share
        format: percent
        better: lower
      - name: temporary_account_edits
        description: Edits made from temporary accounts (named ~...), a subset of anonymous edits. The other anonymous edits come from IP addresses. Uses the is_temporary flag where it is sent (from around October 2026) and the '~' editor name otherwise.
        agg: count
        filters: ["{{ temporary_account_edit() }}"]
        label: Temporary-account edits
        format: integer

  - name: edit_content
    description: >
      What the edits changed, not just how many there were: bytes added and
      removed (kept apart, unlike net_bytes), how big a typical edit is, and the
      shares of edits marked minor, saved without a summary, or removing 1,000
      bytes or more. Slice by edit size, article size, whether text was added or
      removed, and who edited. Use it to tell substantive writing from
      maintenance, and large anonymous removals (a vandalism signal) from the rest.
    source: edits
    time_dimension: event_ts
    dimensions:
      - {name: event_ts, type: timestamp, label: Time}
      - {name: wiki, type: string, label: Wiki}
      - {name: language, type: string, label: Language}
      - {name: kind, type: string, label: Kind, description: "edit, or new for an article's first edit."}
      - name: editor_type
        type: string
        label: Editor
        description: Who made the edit, broadly; bot, anonymous (an IP address or temporary account) or registered.
        sql: "{{ editor_type() }}"
      - name: marked_minor
        type: string
        label: Minor
        description: minor when the editor marked the edit minor (a typo or formatting fix, by their own account), otherwise not minor.
        sql: "CASE WHEN is_minor = true THEN 'minor' ELSE 'not minor' END"
      - name: change
        type: string
        label: Change
        description: Whether the edit made the article longer (added), shorter (removed), or left its size alone (no change).
        sql: >-
          CASE WHEN bytes_delta > 0 THEN 'added' WHEN bytes_delta < 0 THEN 'removed'
          WHEN bytes_delta = 0 THEN 'no change' ELSE 'unknown' END
      - name: edit_size
        type: string
        label: Edit size
        description: >
          How many bytes the edit changed, added or removed, in bands of ten: in
          October 2026, 5% changed none, 22% under 10, 44% under 100, 22% under
          1,000, 5% under 10,000 and under 1% more.
        sql: >-
          CASE WHEN bytes_delta IS NULL THEN 'unknown' WHEN bytes_delta = 0 THEN 'none'
          WHEN abs(bytes_delta) < 10 THEN '1-9 B' WHEN abs(bytes_delta) < 100 THEN '10-99 B'
          WHEN abs(bytes_delta) < 1000 THEN '100-999 B' WHEN abs(bytes_delta) < 10000 THEN '1-10 kB'
          ELSE '10 kB+' END
      - name: article_size
        type: string
        label: Article size
        description: >
          The article's size after the edit: stub under 2 kB, short under 10 kB,
          medium under 50 kB, long beyond. A median edited article is about 9.5 kB.
        sql: >-
          CASE WHEN page_bytes IS NULL THEN 'unknown' WHEN page_bytes < 2000 THEN 'stub (<2 kB)'
          WHEN page_bytes < 10000 THEN 'short (2-10 kB)' WHEN page_bytes < 50000 THEN 'medium (10-50 kB)'
          ELSE 'long (50 kB+)' END
    metrics:
      - name: all_edits
        description: Number of edits; the denominator of this model's shares.
        agg: count
        label: Edits
      - name: bytes_added
        description: Bytes added by the edits that made articles longer.
        agg: sum
        sql: bytes_delta
        filters: ["bytes_delta > 0"]
        label: Bytes added
        format: integer
      - name: bytes_removed
        description: Bytes removed by the edits that made articles shorter, as a positive number.
        agg: sum
        sql: abs(bytes_delta)
        filters: ["bytes_delta < 0"]
        label: Bytes removed
        format: integer
      - name: median_edit_size
        description: >
          The median number of bytes an edit changed, added or removed. Exact on
          DuckDB, approximate on Trino and Pinot; a percentile can't be combined
          across tiers or days, so the newest minutes may be left out (see coverage).
        agg: percentile
        percentile: 0.5
        sql: abs(bytes_delta)
        label: Median edit size
        unit: B
      - name: p90_edit_size
        description: Bytes changed by an edit at the 90th percentile; the size only the biggest tenth of edits exceed. Approximate like median_edit_size.
        agg: percentile
        percentile: 0.9
        sql: abs(bytes_delta)
        label: 90th percentile edit size
        unit: B
      - name: minor_edits
        description: Edits their editors marked minor.
        agg: count
        filters: ["is_minor = true"]
        label: Minor edits
      - name: minor_share
        description: Share of edits marked minor.
        type: ratio
        numerator: minor_edits
        denominator: all_edits
        label: Minor share
        format: percent
      - name: large_removals
        description: Edits removing 1,000 bytes or more.
        agg: count
        filters: ["{{ large_removal() }}"]
        label: Large removals
      - name: large_removal_share
        description: >
          Share of edits removing 1,000 bytes or more. Higher among anonymous
          editors than registered ones; few are marked as reverts, so most are
          blanking, vandalism or trims rather than its clean-up.
        type: ratio
        numerator: large_removals
        denominator: all_edits
        label: Large-removal share
        format: percent
        better: lower
      - name: unsummarized_edits
        description: Edits saved without an edit summary.
        agg: count
        filters: ["{{ no_summary() }}"]
        label: Without a summary
      - name: no_summary_share
        description: Share of edits saved without an edit summary, which leaves other editors (and Claude) less to go on.
        type: ratio
        numerator: unsummarized_edits
        denominator: all_edits
        label: No-summary share
        format: percent
        better: lower

  - name: trends
    description: >
      Bursts: articles getting far more edits than usual, flagged by the burst
      detector as they happen. One row per burst, with its numbers, the news
      classifier's probability that a story is breaking, and Claude's read.
    source: trends
    time_dimension: event_ts
    dimensions:
      - {name: event_ts, type: timestamp, label: Time}
      - {name: wiki, type: string, label: Wiki}
      - {name: language, type: string, label: Language}
      - {name: title, type: string, label: Title}
      - {name: url, type: string, label: Article}
      - name: reading
        type: string
        label: Claude's read
        description: >
          Claude's label for the burst: news (a real-world event), edit war,
          routine or unclear; "not read" when Claude didn't read it (no API key,
          or its hourly budget was spent).
        sql: "{{ claude_reading() }}"
      - {name: explanation, type: string, label: What's happening, description: Claude's one sentence about the burst.}
      - name: classifier_says
        type: string
        label: Classifier's call
        description: news when the classifier gives a probability of 0.5 or more, otherwise other; untrained until it has enough labels.
        sql: "CASE WHEN p_news IS NULL THEN 'untrained' WHEN {{ called_news() }} THEN 'news' ELSE 'other' END"
    metrics:
      - name: bursts
        description: Number of bursts flagged.
        agg: count
        label: Bursts
      - name: burst_articles
        description: Number of different articles that burst.
        agg: count_distinct
        sql: url
        label: Articles
      - name: read_bursts
        description: Bursts Claude read and labeled.
        agg: count
        filters: ["claude_label IS NOT NULL"]
        label: Read by Claude
      - name: news_bursts
        description: Bursts Claude labeled news.
        agg: count
        filters: ["claude_label = 'news'"]
        label: News bursts
      - name: news_share
        description: Share of the bursts Claude read that it labeled news.
        type: ratio
        numerator: news_bursts
        denominator: read_bursts
        label: News share
        format: percent
      - name: peak_edits
        description: Most edits a burst had in its 30 minutes.
        agg: max
        sql: edits_30m
        label: Edits in 30 min
        format: integer
      - name: peak_editors
        description: Most different editors a burst had in its 30 minutes.
        agg: max
        sql: editors_30m
        label: Editors
        format: integer
      - name: peak_surprise
        description: >
          How far above usual a burst's edits were, in standard deviations
          (usual: for an article being edited on that wiki at that hour of the day).
        agg: max
        sql: surprise
        label: Surprise
        unit: σ
      - name: news_probability
        description: The news classifier's probability that a burst is a story breaking (averaged over bursts).
        agg: avg
        sql: p_news
        label: News probability
        format: percent
      - name: judged_bursts
        description: Bursts both the classifier and Claude judged (leaving out those Claude found unclear).
        agg: count
        filters: ["{{ judged_by_both() }}"]
        label: Judged by both
      - name: agreed_bursts
        description: Bursts where the classifier's call (news at a probability of 0.5 or more) matched Claude's label.
        agg: count
        filters:
          - "{{ judged_by_both() }}"
          - "({{ called_news() }} AND claude_label = 'news') OR (NOT ({{ called_news() }}) AND claude_label <> 'news')"
        label: Agreed
      - name: agreement
        description: >
          How often the news classifier agrees with Claude, on bursts both judged.
          The detector scores each burst with the model trained before it, so this
          is the classifier's accuracy on bursts it hadn't seen.
        type: ratio
        numerator: agreed_bursts
        denominator: judged_bursts
        label: Agreement with Claude
        format: percent
        better: higher

  - name: classifier_eval
    description: >
      How good the news classifier is, judged against Claude's labels: the
      confusion matrix, precision, recall and the Brier score on the bursts both
      judged, and how many bursts Claude labeled at all. The detector scores each
      burst with the model trained before it, so these are out-of-sample. Labeled
      bursts are few, and Claude reads only the first fresh bursts of each hour,
      so read every rate alongside its counts and label_coverage.
    source: trends
    time_dimension: event_ts
    dimensions:
      - {name: event_ts, type: timestamp, label: Time}
      - {name: wiki, type: string, label: Wiki}
      - {name: language, type: string, label: Language}
      - name: reading
        type: string
        label: Claude's read
        description: Claude's label for the burst (news, edit war, routine or unclear), or "not read".
        sql: "{{ claude_reading() }}"
      - name: classifier_says
        type: string
        label: Classifier's call
        description: news when the classifier gives a probability of 0.5 or more, otherwise other; untrained until it has enough labels.
        sql: "CASE WHEN p_news IS NULL THEN 'untrained' WHEN {{ called_news() }} THEN 'news' ELSE 'other' END"
      - name: score_band
        type: string
        label: News probability
        description: >
          The classifier's probability that the burst is news, in bands, to check
          calibration: within a band, the share Claude labeled news should be
          about the band's probability. "unscored" before the classifier was trained.
        sql: >-
          CASE WHEN p_news IS NULL THEN 'unscored' WHEN p_news < 0.1 THEN '0-10%'
          WHEN p_news < 0.3 THEN '10-30%' WHEN p_news < 0.5 THEN '30-50%'
          WHEN p_news < 0.7 THEN '50-70%' ELSE '70-100%' END
      - name: hour_of_day
        type: number
        label: Hour (UTC)
        description: >
          The hour of the day the burst was flagged, 0 to 23 UTC. Claude reads at
          most 10 bursts an hour, the first that arrive, so its coverage varies
          through the day.
        sql: "hour(event_ts)"
    metrics:
      - name: flagged_bursts
        description: Number of bursts flagged, labeled or not.
        agg: count
        label: Bursts
      - name: labeled_bursts
        description: Bursts Claude read and labeled (any label, unclear included).
        agg: count
        filters: ["claude_label IS NOT NULL"]
        label: Labeled by Claude
      - name: label_coverage
        description: >
          Share of bursts Claude labeled. The classifier learns from and is judged
          on this sample only; where coverage is low, the sample may not represent
          the bursts the classifier scores unseen.
        type: ratio
        numerator: labeled_bursts
        denominator: flagged_bursts
        label: Label coverage
        format: percent
      - name: scored_bursts
        description: Bursts the classifier scored (none before it was first trained).
        agg: count
        filters: ["p_news IS NOT NULL"]
        label: Scored
      - name: evaluated_bursts
        description: Bursts the classifier scored and Claude labeled news, edit war or routine; every rate below is over these.
        agg: count
        filters: ["{{ judged_by_both() }}"]
        label: Evaluated
      - name: true_positives
        description: Evaluated bursts the classifier called news (probability 0.5 or more) and Claude labeled news.
        agg: count
        filters: ["{{ judged_by_both() }}", "{{ called_news() }}", "claude_label = 'news'"]
        label: News caught
      - name: false_positives
        description: Evaluated bursts the classifier called news that Claude labeled an edit war or routine.
        agg: count
        filters: ["{{ judged_by_both() }}", "{{ called_news() }}", "claude_label <> 'news'"]
        label: False alarms
      - name: false_negatives
        description: Evaluated bursts Claude labeled news that the classifier didn't call news.
        agg: count
        filters: ["{{ judged_by_both() }}", "NOT ({{ called_news() }})", "claude_label = 'news'"]
        label: News missed
      - name: true_negatives
        description: Evaluated bursts the classifier didn't call news and Claude labeled an edit war or routine.
        agg: count
        filters: ["{{ judged_by_both() }}", "NOT ({{ called_news() }})", "claude_label <> 'news'"]
        label: Correctly not news
      - name: news_calls
        description: Evaluated bursts the classifier called news, right or wrong (true positives plus false positives).
        agg: count
        filters: ["{{ judged_by_both() }}", "{{ called_news() }}"]
        label: Called news
      - name: evaluated_news
        description: Evaluated bursts Claude labeled news (true positives plus false negatives).
        agg: count
        filters: ["{{ judged_by_both() }}", "claude_label = 'news'"]
        label: News (Claude)
      - name: news_precision
        description: Of the evaluated bursts the classifier called news, the share Claude labeled news. Empty when it called none.
        type: ratio
        numerator: true_positives
        denominator: news_calls
        label: Precision
        format: percent
        better: higher
      - name: news_recall
        description: Of the evaluated bursts Claude labeled news, the share the classifier called news.
        type: ratio
        numerator: true_positives
        denominator: evaluated_news
        label: Recall
        format: percent
        better: higher
      - name: news_base_rate
        description: >
          Share of evaluated bursts Claude labeled news. Read precision against it:
          a classifier that guesses at random has precision equal to the base rate.
        type: ratio
        numerator: evaluated_news
        denominator: evaluated_bursts
        label: News among evaluated
        format: percent
      - name: squared_error
        description: >
          Sum, over evaluated bursts, of the squared gap between the classifier's
          probability and the outcome (1 for news, 0 otherwise). A building block
          for brier_score that adds up across days and tiers.
        agg: sum
        sql: "(p_news - {{ news_outcome() }}) * (p_news - {{ news_outcome() }})"
        filters: ["{{ judged_by_both() }}"]
        label: Squared error (sum)
      - name: brier_score
        description: >
          Mean squared error of the classifier's probabilities on evaluated bursts:
          0 is perfect. Always answering the base rate scores base rate × (1 − base
          rate), about 0.07 when 8% are news; a useful model scores below that.
        type: ratio
        numerator: squared_error
        denominator: evaluated_bursts
        label: Brier score
        better: lower
      - name: p_news_when_news
        description: The classifier's average probability on evaluated bursts Claude labeled news.
        agg: avg
        sql: p_news
        filters: ["{{ judged_by_both() }}", "claude_label = 'news'"]
        label: Probability given to news
        format: percent
      - name: p_news_when_other
        description: The classifier's average probability on evaluated bursts Claude labeled an edit war or routine.
        agg: avg
        sql: p_news
        filters: ["{{ judged_by_both() }}", "claude_label <> 'news'"]
        label: Probability given to other
        format: percent
