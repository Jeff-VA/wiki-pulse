# Long-term storage: one Iceberg table per dataset, filled by the flush, and
# rollups: semantic queries kept as gold tables, published only after their
# quality checks (quality_rules.yaml) pass. pipelines.yaml builds on these.
version: "1.0.0"

tables:
  - dataset: edits
    table: raw.edits
    partition_by: day
    flush_every_minutes: 5
    allowed_lateness_minutes: 2
  - dataset: trends
    table: raw.trends
    partition_by: day
    flush_every_minutes: 5
    allowed_lateness_minutes: 1

rollups:
  - table: gold.wiki_hourly
    description: >
      Each wiki's hour of editing: edits, editors, new articles, and the edits
      by bots, anonymous editors and reverts.
    query:
      metrics: [edit_count, editors, new_articles, bot_edits, anonymous_edits, revert_edits, net_bytes]
      dimensions: [wiki, language]
      grain: hour
    lookback_hours: 3
    backfill_days: 2
    every_minutes: 10

  - table: gold.article_hourly
    description: >
      Each article's hour of editing, for every article edited in the hour. The
      burst detector's sense of normal (trend_baselines) and the daily top
      articles are computed from it.
    query:
      metrics: [edit_count, editors, revert_edits]
      dimensions: [wiki, language, title, url]
      grain: hour
    lookback_hours: 3
    backfill_days: 2
    every_minutes: 15

  - table: gold.classifier_daily
    description: >
      Each day's judging of the news classifier against Claude's labels
      (classifier_eval): bursts flagged, labeled, scored and evaluated, the
      confusion matrix and the squared error. Counts and sums, not rates, so any
      span of days adds up: precision is the sum of true_positives over the sum
      of true_positives + false_positives, the Brier score squared_error over
      evaluated_bursts.
    query:
      metrics: [flagged_bursts, labeled_bursts, scored_bursts, evaluated_bursts, true_positives, false_positives, false_negatives, true_negatives, squared_error]
      grain: day
    lookback_hours: 24
    backfill_days: 7
    every_minutes: 60
